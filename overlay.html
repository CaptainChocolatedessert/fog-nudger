<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog Nudger — ink overlay</title>
    <style>
      /*
        Transparent throughout, in both directions and on purpose. A background colour anywhere
        would hide the map, which is the one thing this page exists to be compared against — and
        it would do it silently, looking exactly like an overlay painting far too much ink.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #sheet {
        position: fixed;
        inset: 0;
        display: block;
      }
      /*
        Bottom-left, away from Owlbear's own furniture, and only shown when there is something to
        say. The overlay covers the whole window including the toolbars, so anything permanent up
        here is one more thing sitting on top of the GM's tools.
      */
      #status {
        position: fixed;
        left: 0.5rem;
        bottom: 0.5rem;
        max-width: 26rem;
        padding: 0.4rem 0.6rem;
        border-radius: 0.4rem;
        background: rgba(20, 22, 34, 0.88);
        color: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        line-height: 1.4;
      }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <!--
      Stage one's representation: the binary mask painted over the map it was read from.

      The point probe answers "what did you decide here" one pixel at a time, and it is the only
      diagnostic in this project that has reliably worked, because every other one reports a total
      and a total cannot say what is happening *there*. This is that answer for every pixel at once.

      What it draws is only the mask, which is exactly what stage one decides — ink, and everything
      else left alone. Kept-versus-discarded floor is a stage-two distinction and belongs with the
      regions.
    -->
    <canvas id="sheet"></canvas>
    <p id="status"></p>
    <script type="module" src="./src/overlay.ts"></script>
  </body>
</html>
