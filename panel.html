<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog Nudger</title>
    <style>
      /*
        A complete, opaque, self-consistent palette, overridden at runtime from Owlbear's own
        theme. Not `prefers-color-scheme`: Owlbear carries its own light/dark setting and the OS
        preference can disagree with the surface this panel is sitting on.

        These defaults are load-bearing rather than decorative. The first version set no
        background at all, which left the iframe transparent — Owlbear's dark popover showed
        through while the text stayed the UA's black. So the page must read correctly before the
        theme arrives, if the theme call fails, and if the payload is missing fields.

        Dark, because that is Owlbear's default. Being wrong about that costs a panel that does
        not match its host; having no background at all costs a panel that cannot be read.
      */
      :root {
        --bg: #222639;
        --text: #ffffff;
        --dim: rgba(255, 255, 255, 0.7);
        --accent: #bb99ff;
        --danger: #ff8a80;
        --line: #ffffff1f;
      }
      body {
        margin: 0;
        padding: 0.9rem 1rem;
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        line-height: 1.45;
        background: var(--bg);
        color: var(--text);
      }
      h1 { font-size: 0.95rem; margin: 0 0 0.5rem; font-weight: 600; }
      p { margin: 0.4rem 0; }
      #status { color: var(--dim); }
      #status[data-state="bad"] { color: var(--danger); }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.9em;
        color: var(--dim);
      }
      .probe {
        margin-top: 0.8rem;
        padding-top: 0.7rem;
        border-top: 1px solid var(--line);
      }
      .probe h2 {
        font-size: 0.8rem;
        margin: 0 0 0.5rem;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--line);
        border: 1px solid transparent;
        border-radius: 0.35rem;
        padding: 0.35rem 0.7rem;
        margin: 0 0.3rem 0.3rem 0;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      #result {
        margin-top: 0.5rem;
        font-size: 0.8rem;
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      #result[data-state="bad"] { color: var(--danger); }
    </style>
  </head>
  <body>
    <h1>Fog Nudger</h1>
    <!--
      Deliberately says something in every state, including the boring one. A panel that only
      speaks when something is wrong cannot tell "fine" from "never ran" — which is the failure
      this whole panel exists to rule out at this stage.
    -->
    <p id="status" data-state="pending">Connecting&hellip;</p>

    <!--
      Not product UI. Step 1's shape-placing buttons are gone now that it is closed; these two
      earned a longer stay because they answer "what is actually in this scene" for every stage
      that follows.
    -->
    <section class="probe">
      <h2>Diagnostics</h2>
      <button id="census" disabled>Census</button>
      <button id="inspect" disabled>Inspect fog</button>
      <p id="result">Waiting for a scene.</p>
    </section>

    <script type="module" src="./src/panel.ts"></script>
  </body>
</html>
