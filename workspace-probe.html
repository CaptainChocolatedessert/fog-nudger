<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog Nudger — workspace probe</title>
    <style>
      /*
        Opaque everywhere, deliberately, and that is the inverse of the overlay probe's stylesheet.

        That page set `background: transparent` on `html` and `body` so it could not answer "is the
        modal transparent" about its own CSS instead of about Owlbear. This page asks the opposite
        question — can a modal be an opaque window we navigate ourselves — so it paints a solid
        ground and the thing to look for is anything of Owlbear's showing through or over it.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e1020;
        color: #e8e9f5;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.72rem;
        line-height: 1.5;
        overflow: hidden;
        /*
          A working surface, not a document. A drag that selects a run of the readout instead of
          panning the map is the single most likely way this feels broken on first contact.
        */
        user-select: none;
      }

      #sheet {
        position: fixed;
        inset: 0;
        /* Focused programmatically to claim the keyboard, so no ring — an outline round the whole
           screen reads as a rendering fault rather than as focus. */
        outline: none;
        /* Our own gesture handling, not the browser's: without this a touch drag scrolls the page
           and a pinch zooms the document, both of which fight the navigation underneath. */
        touch-action: none;
        cursor: grab;
      }
      #sheet.dragging {
        cursor: grabbing;
      }

      /*
        The map and the synthetic mask are drawn here, both at map resolution, both every frame that
        the view changes. That is the workload the real workspace has, which is what makes the frame
        cost on the readout mean something.
      */
      #canvas {
        position: fixed;
        inset: 0;
        display: block;
      }

      /*
        This iframe's exact extent. Both chrome variants report the same rectangle, so this is
        confirmation rather than a measurement now — but it is one pixel of stroke and it is the
        thing that would look wrong first if Owlbear ever changed how a full-screen modal is sized.
      */
      #frame {
        position: fixed;
        inset: 0;
        border: 1px dashed rgba(255, 96, 160, 0.35);
        pointer-events: none;
      }

      #hud {
        position: fixed;
        top: 0.6rem;
        left: 0.6rem;
        max-width: 27rem;
        padding: 0.55rem 0.7rem;
        border-radius: 0.4rem;
        background: rgba(14, 16, 32, 0.86);
        box-shadow: 0 0 0 1px rgba(187, 153, 255, 0.3);
        white-space: pre-wrap;
        pointer-events: none;
      }
      #hud.hidden {
        display: none;
      }
      #hud b {
        color: #bb99ff;
      }
      #hud .bad {
        color: #ff8080;
        font-weight: bold;
      }
      #hud .key {
        color: #ffd479;
      }

      /*
        The close button keeps pointer events while the HUD does not, so it can be clicked without
        the HUD swallowing a drag that starts over it. It stays visible rather than hiding with the
        HUD: the way out should not be behind a keyboard shortcut on a surface whose keyboard is
        the thing least certain to work.
      */
      #close {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        padding: 0.4rem 0.6rem;
        border-radius: 0.35rem;
        border: 1px solid rgba(187, 153, 255, 0.45);
        background: rgba(34, 26, 58, 0.9);
        color: #e8e9f5;
        font: inherit;
        cursor: pointer;
      }
      #close:hover {
        background: #2c2250;
      }
    </style>
  </head>
  <body>
    <!--
      A throwaway measurement page, not the workspace.

      The input half is settled (DESIGN.md §4): this modal owns pointer, wheel and right-click with
      nothing reaching Owlbear underneath, and the keyboard is ours once claimed. The pad and the
      text box that established that are gone, superseded by the map — panning it is a better drag
      test than a scratch canvas ever was, because it is the actual gesture.

      What is open is the question no test can answer: **does pan and zoom feel right beside
      Owlbear's own?** So this draws the map, opens on exactly the view Owlbear was showing, and
      lets it be navigated. Nothing else — no controls, no marks.

      The one thing it adds beyond feeling: **the feel constants are adjustable from the keyboard**,
      and logged. "Too fast" is a complaint; "22% a notch" is a number the workspace can be built
      with.

      It also measures the other unknown — frame cost with a map-sized image drawn every frame, plus
      a second one standing in for the mask, which is the real workload.

      THE WAY OUT is still three mechanisms that share nothing: a timer armed at module load, the
      close button, and Escape. The timer is the one that has to work.
    -->
    <div id="sheet" tabindex="-1">
      <canvas id="canvas"></canvas>
      <div id="frame"></div>
      <pre id="hud">Workspace probe starting…</pre>
    </div>
    <button id="close">Close (Esc)</button>

    <script type="module" src="./src/workspaceProbe.ts"></script>
  </body>
</html>
