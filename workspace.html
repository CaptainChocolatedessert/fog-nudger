<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog Nudger</title>
    <style>
      /*
        Opaque, and that is the whole point of this surface rather than an incidental style choice.

        The click-through overlay this replaces was transparent so the map could show through
        Owlbear's own rendering, and everything hard about it followed from not owning the view.
        Here we draw the map ourselves, so map and mask agree by construction rather than by our
        arithmetic agreeing with somebody else's.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e1020;
        color: #e8e9f5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        overflow: hidden;
        user-select: none;
      }

      #surface {
        position: fixed;
        inset: 0;
        outline: none;
        /* Ours, not the browser's: without this a touch drag scrolls the page and a pinch zooms the
           document, both fighting the navigation underneath. */
        touch-action: none;
      }

      /*
        The canvas is what pans, so the grab cursor lives here rather than on the surface — over a
        button or a slider the pointer should look like a pointer.
      */
      #canvas {
        position: fixed;
        inset: 0;
        display: block;
        /*
          Stated, not inferred from `inset: 0`.

          A canvas is a *replaced* element, so it keeps its intrinsic 300x150 rather than stretching
          to fill four zero insets the way a div would. It ends up full-size anyway once the first
          frame runs and sets explicit dimensions — but until then it is a small rectangle in the
          corner, and everything outside it hits the surface behind. Found by asking
          `elementFromPoint` where a press over the map actually lands, which answered `#surface`.
        */
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #canvas.dragging {
        cursor: grabbing;
      }
      /*
        Something slow is running. The cursor says it wherever the pointer is, which is the half that
        survives the derive moving to a worker — only the *ability to keep interacting* changes then,
        and the cursor is what carries that rather than a dimmed panel.
      */
      body.working #canvas,
      body.working #canvas.grab-target {
        cursor: progress;
      }
      /*
        Over a vertex you can take hold of.

        A crosshair rather than a hand, and the reason came from a room: the grab cursor's fingers
        sit exactly over the dot being aimed at, so the target disappears at the moment of aiming
        (user, 2026-09-05). A crosshair is centred and open, so the handle stays visible under it.
      */
      #canvas.grab-target,
      #canvas.grab-target.dragging {
        cursor: crosshair;
      }
      /*
        Named for what each marks on the canvas, so the prose and the picture agree.

        The values come from `palette.ts` at start-up rather than being written here. They used to be
        hardcoded hexes beside comments asking whoever changed one to change the other, which is a
        promise nobody can keep across three layer modules and a stylesheet.
      */
      .join-key,
      .gap-key,
      .addink-key {
        color: var(--additive);
      }
      .suppress-key {
        color: var(--subtractive);
      }

      /* ----------------------------------------------------------------------------------------
         The controls, docked rather than floating.

         The click-through overlay kept its controls in the popover and spent real machinery on not
         painting over them — a poll, a heartbeat and a reserved band down one side. Owning the
         surface means the controls simply have a place on it, and the map is drawn in what is left.
         ---------------------------------------------------------------------------------------- */
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 22rem;
        max-width: 42vw;
        box-sizing: border-box;
        /* A column, so the head can stay put while the groups scroll under it. */
        display: flex;
        flex-direction: column;
        background: rgba(16, 18, 36, 0.94);
        border-right: 1px solid rgba(187, 153, 255, 0.25);
        backdrop-filter: blur(6px);
      }
      #panel-head {
        flex: none;
        padding: 0.9rem 1rem 0;
      }
      /*
        `min-height: 0` is what makes the scroll actually happen: a flex child's default is
        `min-height: auto`, which refuses to shrink below its content, so the body would grow the
        column past the viewport and take the head off the top with it rather than scrolling.
      */
      #panel-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 1rem 1.4rem;
      }
      #panel.hidden {
        display: none;
      }

      h1 {
        margin: 0 0 0.15rem;
        font-size: 1rem;
      }
      h2 {
        margin: 1.2rem 0 0.5rem;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #bb99ff;
      }
      .sub {
        margin: 0 0 0.4rem;
        color: #9aa0c8;
        font-size: 0.8rem;
      }

      .row {
        margin: 0 0 0.9rem;
      }
      .row .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .row label {
        font-weight: 600;
      }
      .row .value {
        font-family: ui-monospace, Consolas, monospace;
        color: #ffd479;
      }
      .row input[type="range"] {
        width: 100%;
        margin: 0.3rem 0 0.1rem;
        accent-color: #bb99ff;
      }
      .row .hint {
        margin: 0;
        font-size: 0.76rem;
        color: #9aa0c8;
      }
      .row .hint b {
        color: #c9cdea;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        align-items: center;
        margin-bottom: 0.6rem;
      }
      .swatches button {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 0;
        cursor: pointer;
      }
      .swatches input[type="color"] {
        width: 2.4rem;
        height: 1.6rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 0.25rem;
        background: transparent;
      }

      /*
        The indeterminate strip, along the top edge of the canvas.

        Peripheral and covers nothing: a derive is the better part of a second and needs to read as
        working rather than as a hang, but it happens on every slider release and must not be
        something a GM has to look at. It says "in flight" and deliberately not "how far", because
        the trace reports no progress and a bar that invented one would be a guess drawn as a
        measurement.
      */
      #working {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 30;
        overflow: hidden;
        display: none;
      }
      body.working #working {
        display: block;
      }
      #working::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        background: #bb99ff;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      /*
        A held handle, at the value the picture was actually computed from.

        The staleness signal used to be a line of small monospace text in the bottom-right corner
        while the GM's attention was on the slider they had just moved. The information was never
        missing; it was nowhere near where anyone was looking. On the track it is also legible when
        several rows are ahead at once, which one status line can never be.
      */
      .row .track {
        position: relative;
      }
      .row .ghost {
        position: absolute;
        top: 0.3rem;
        width: 2px;
        height: 0.85rem;
        margin-left: -1px;
        background: #ffd479;
        opacity: 0.85;
        pointer-events: none;
      }

      /* ----------------------------------------------------------------------------------------
         The tool strip: what a press means, chosen once for the whole surface.

         Docked beside the rail rather than inside a step, which is the change that lets the rail
         stop being exclusive. While a heading bound the drag, two expanded headings were two
         meanings for one press; with the verb chosen here a heading decides only what is on screen.

         Banded in the order the rail is numbered by, so reading down the strip and reading down the
         rail meet the same three subjects in the same sequence.
         ---------------------------------------------------------------------------------------- */
      #tools {
        position: fixed;
        top: 0;
        left: 22rem;
        bottom: 0;
        width: 6.3rem;
        box-sizing: border-box;
        padding: 0.9rem 0.5rem;
        overflow-y: auto;
        background: rgba(12, 14, 30, 0.94);
        border-right: 1px solid rgba(187, 153, 255, 0.25);
        backdrop-filter: blur(6px);
      }
      #tools.hidden {
        display: none;
      }
      .tool-band {
        margin: 0 0 0.3rem;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7f86ad;
      }
      .tool-rule {
        height: 1px;
        margin: 0.7rem 0;
        background: rgba(187, 153, 255, 0.18);
      }
      button.tool {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        width: 100%;
        margin: 0 0 0.25rem;
        padding: 0.3rem 0.35rem;
        border-radius: 0.3rem;
        border: 1px solid transparent;
        background: transparent;
        color: #c2c7e4;
        font: inherit;
        font-size: 0.74rem;
        text-align: left;
        cursor: pointer;
      }
      /*
        Sized here rather than on the element, so one rule covers all seven. `currentColor` in the
        glyph means the selected state needs no second rule: the button inverts and the drawing
        follows.
      */
      button.tool svg {
        width: 1.05rem;
        height: 1.05rem;
        flex: none;
      }
      button.tool:hover:not(:disabled) {
        background: rgba(187, 153, 255, 0.14);
        color: #e8e9f5;
      }
      button.tool[aria-pressed="true"] {
        background: #bb99ff;
        border-color: #bb99ff;
        color: #14162a;
        font-weight: 600;
      }
      button.tool:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /*
        What the tool in hand does, at the top of the rail rather than beside the tool's controls.

        Under a rail that no longer forces one section shut, those controls may be collapsed while
        the tool is still in hand — and what a press will do must not depend on which headings
        happen to be expanded.
      */
      #tool-hint {
        margin: 0 0 0.9rem;
        padding: 0.45rem 0.6rem;
        border-left: 2px solid #bb99ff;
        background: rgba(187, 153, 255, 0.09);
        font-size: 0.8rem;
        color: #c2c7e4;
      }
      #tool-hint:empty {
        display: none;
      }

      /*
        How much a re-read would cost, in the head so it does not depend on what is expanded.

        Amber rather than red: hand edits are not a problem, they are work. What the line is for is
        that changing the reading throws them away, and a GM cannot weigh that without knowing there
        is something to weigh. Absent at zero, which is most of the time.
      */
      /*
        Whether a layer is drawn at all, beside the hint that says what a press does.

        Grows with what is happening rather than listing all five always: a switch appears for a
        layer something is actually asking for, so the row is empty when nothing is, and a layer the
        GM has hidden keeps its switch because that is how it comes back.
      */
      #layer-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin: 0 0 0.9rem;
      }
      #layer-row:empty {
        display: none;
      }
      button.layer {
        padding: 0.2rem 0.45rem;
        border-radius: 0.3rem;
        border: 1px solid rgba(187, 153, 255, 0.3);
        background: transparent;
        color: #7f86ad;
        font: inherit;
        font-size: 0.72rem;
        cursor: pointer;
      }
      button.layer:hover {
        color: #e8e9f5;
      }
      button.layer[aria-pressed="true"] {
        background: rgba(187, 153, 255, 0.18);
        border-color: rgba(187, 153, 255, 0.55);
        color: #e8e9f5;
      }

      #edit-count {
        margin: 0 0 0.9rem;
        padding: 0.35rem 0.6rem;
        border-left: 2px solid #f59e0b;
        background: rgba(245, 158, 11, 0.1);
        font-size: 0.78rem;
        color: #f0b357;
      }
      #edit-count:empty {
        display: none;
      }

      /* ----------------------------------------------------------------------------------------
         The groups, as a rail rather than an exclusive accordion.

         Every header stays on screen in order, so the cascade is a shape rather than something to
         remember. **Several may be expanded at once**, which is what the tool strip bought: while a
         step bound the drag, exclusivity was what kept "one meaning for a press" true, and forcing
         one section shut to read another made the commonest move in the job expensive.
         ---------------------------------------------------------------------------------------- */
      .step {
        border-top: 1px solid rgba(187, 153, 255, 0.18);
      }
      .step:last-of-type {
        border-bottom: 1px solid rgba(187, 153, 255, 0.18);
      }
      .step-header {
        display: block;
        width: 100%;
        padding: 0.6rem 0.1rem;
        border: 0;
        background: transparent;
        color: #9aa0c8;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        text-align: left;
        cursor: pointer;
      }
      .step-header:hover:not(:disabled) {
        color: #e8e9f5;
      }
      /*
        A group the map gate has not opened yet. Dimmed rather than hidden, so the order of what is
        coming is visible from the first frame — the rail's order is the cascade, and a cascade with
        its later half missing does not teach it.

        **0.65 rather than 0.4, and the number is measured.** At 0.4 the header computed to 2.17:1
        against the panel, which is below even the 3:1 floor for non-text UI — so a heading that
        exists precisely to be *read* while inactive could not be. 0.65 lands at 3.74:1: still
        unmistakably disabled beside a live header at 7.26:1, and legible.
      */
      .step.locked > .step-header {
        opacity: 0.65;
        cursor: default;
      }
      /* The open step is named in the accent colour and marked down the edge, because an accordion
         header is a weaker "you are here" than a selected tab and needs the help. */
      .step.open > .step-header {
        color: #bb99ff;
        box-shadow: inset 2px 0 0 #bb99ff;
        padding-left: 0.6rem;
      }
      .step:not(.open) > .step-body {
        display: none;
      }
      .step-body {
        padding: 0 0 0.4rem 0.6rem;
      }
      .step-body h3 {
        margin: 1rem 0 0.35rem;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa0c8;
      }

      #view-group {
        margin-top: 0.4rem;
      }

      /* A step's own actions, at the end of its body. */
      .step-actions {
        display: flex;
        gap: 0.4rem;
        margin: 0.6rem 0 0.4rem;
      }
      .step-actions .quiet {
        border-color: rgba(187, 153, 255, 0.25);
        background: transparent;
        color: #9aa0c8;
      }
      .step-actions .quiet:hover {
        color: #e8e9f5;
      }
      .step-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* The map picker, the one step whose body is a list rather than sliders. */
      .maps {
        margin: 0.2rem 0 0.4rem;
      }
      .maps label {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        padding: 0.3rem 0.4rem;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .maps label:hover {
        background: rgba(187, 153, 255, 0.14);
      }
      .maps input {
        margin: 0;
        accent-color: #bb99ff;
      }
      .maps .note {
        color: #9aa0c8;
        font-size: 0.78rem;
      }

      /* ----------------------------------------------------------------------------------------
         The bar. Deliberately outside the panel, so hiding the controls to see the whole map does
         not also hide the way out.
         ---------------------------------------------------------------------------------------- */
      #bar {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }
      button.chip {
        padding: 0.4rem 0.65rem;
        border-radius: 0.35rem;
        border: 1px solid rgba(187, 153, 255, 0.45);
        background: rgba(34, 26, 58, 0.92);
        color: #e8e9f5;
        font: inherit;
        cursor: pointer;
      }
      button.chip:hover {
        background: #2c2250;
      }
      /*
        Disabled rather than hidden, so the surface says undo exists before there is anything to
        undo. A control that appears only once it is usable teaches nothing about what is possible.
      */
      button.chip:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.chip[aria-pressed="true"] {
        background: #bb99ff;
        color: #14162a;
        font-weight: 600;
      }
      /*
        The way out of a slow scene write, revealed only once one is slow.

        Closing waits for the write so the fog layer cannot be left half-replaced, which means the
        sheet is up and unresponsive to Escape for as long as the write takes. On a large map that
        is a couple of seconds and reads as working; if it stalls, it reads as a hang. This is the
        fourth exit — the probe's rule is that this surface must never become a cell — and it is
        hidden until there is a stall to escape, because a permanently visible "exit anyway" invites
        being pressed on every ordinary close.
      */
      button.chip.urgent {
        border-color: rgba(255, 212, 121, 0.75);
        color: #ffd479;
      }
      #exit-anyway[hidden] {
        display: none;
      }

      /*
        The confirmation, drawn by us rather than by Owlbear.

        The workspace already owns its whole surface and all of its input, so this needs no modal
        from the SDK and raises no question about nesting one inside another. It is only ever used
        for the two irreversible actions — freezing the graph and discarding it — because a dialog
        that appears often is one a GM learns to dismiss, and the boundary itself is shown by
        disabling what would cross it rather than by asking afterwards.
      */
      #confirm {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: rgba(6, 7, 16, 0.72);
      }
      .confirm-panel {
        max-width: 30rem;
        margin: 1rem;
        padding: 1rem 1.15rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.5rem;
        background: #14162a;
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.55);
      }
      .confirm-panel h2 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
      }
      .confirm-panel p {
        margin: 0 0 0.6rem;
        font-size: 0.8rem;
        line-height: 1.45;
        color: #c8ccdf;
      }
      .confirm-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.9rem;
      }

      /*
        The state of the mask, and the one thing on this page that must never be quietly absent.

        A blank sheet means "no mask is current", and that is a deliberate state rather than a
        failure — but a GM looking at bare map needs to know whether it is computing or has failed.
        (The third case this used to name, "the opacity is at zero", is not reported here and does
        not need to be: the slider's own readout says so, right beside the slider that did it.)
      */
      #state {
        position: fixed;
        bottom: 0.6rem;
        right: 0.6rem;
        padding: 0.35rem 0.6rem;
        border-radius: 0.35rem;
        background: rgba(16, 18, 36, 0.9);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.75rem;
        color: #9aa0c8;
        /*
          Capped and wrapping, rather than growing left across the whole window.

          Most of what lands here is a short figure, but the point probe answers in whole sentences —
          and an unbounded line ran the full width of the map, which is a banner across the thing the
          GM is looking at. The middle bound keeps it clear of the controls on the left however wide
          the window is; the outer one stops a narrow window producing a negative width, which CSS
          discards as invalid — leaving exactly the unbounded line this is here to prevent.
        */
        max-width: max(12rem, min(34rem, calc(100vw - 33rem)));
        text-align: left;
      }
      /*
        With the controls hidden there is no panel to stay clear of, so the middle bound has
        nothing to do and the line was narrower than it needed to be. Only the outer guards
        remain. `:has()` is the whole mechanism; where it is unsupported the line simply keeps
        the tighter cap, which is the safe direction.
      */
      body:has(#panel.hidden) #state {
        max-width: max(12rem, min(34rem, calc(100vw - 2rem)));
      }
      #state.bad {
        color: #ff8080;
      }
      #state.working {
        color: #ffd479;
      }
    </style>
  </head>
  <body>
    <!--
      Stage one: reading the map.

      The GM's question here is "what did it call ink", and the answer is a per-pixel verdict that
      only a picture can carry. So this surface draws the map, paints the ink mask over it, and puts
      the controls that decide the mask on the same surface as the mask.

      It replaces the click-through overlay entirely. That one was transparent and let drags reach
      Owlbear, which meant it could never be painted on and had to infer where the map was on a
      40ms poll — with a settle interval, a blank-and-restore, a reserved band so it would not cover
      the popover, and a heartbeat from the popover so it knew when the band was needed. Every one
      of those was machinery for not owning the transform. None of it is here.

      Deliberately NOT here either: a dismissal timer. The probe had one because an opaque sheet
      that might swallow every click is a trap, and that risk was real while input capture was
      unmeasured. It has since been measured over fifteen runs — pointer, wheel and keyboard all
      arrive, Escape included — so a working surface that evicts a GM mid-tuning would now be
      trading a real cost against a risk that has been retired.
    -->
    <div id="surface" tabindex="-1">
      <canvas id="canvas"></canvas>

      <div id="panel">
        <!--
          The head does not scroll. It says where you are and what a press will do, and both of those
          have to stay true while you are reading something further down — the hint scrolled away
          exactly when a GM was deep in a group and least able to remember which tool was in hand.
        -->
        <div id="panel-head">
          <h1 id="mode-name">Fog Nudger</h1>
          <p class="sub" id="map-name">Loading…</p>
          <p id="tool-hint"></p>
          <div id="layer-row"></div>
          <p id="edit-count"></p>
        </div>

        <!--
          The groups and the persistent View group, both built from the declaration in `steps.ts`
          rather than written out here. Two headings in the markup and a third in the code was how
          the sections drifted apart in the first place, and a group decides what the canvas paints,
          so it cannot be described in a place the canvas cannot read.
        -->
        <div id="panel-body">
          <div id="steps"></div>
          <div id="view-group"></div>
        </div>
      </div>

      <div id="tools"></div>

      <div id="bar">
        <button class="chip" id="undo" disabled title="Nothing to undo">Undo</button>
        <button class="chip" id="fit" title="Fit the whole map">Fit</button>
        <button class="chip" id="toggle-panel" title="Hide the controls" aria-pressed="true">Controls</button>
        <button class="chip" id="close">Close (Esc)</button>
        <button class="chip urgent" id="exit-anyway" hidden>Exit anyway</button>
      </div>

      <div id="working" aria-hidden="true"></div>
      <p id="state">Starting…</p>
    </div>

    <script type="module" src="./src/workspace.ts"></script>
  </body>
</html>
