<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fog Nudger</title>
    <style>
      /*
        Opaque, and that is the whole point of this surface rather than an incidental style choice.

        The click-through overlay this replaces was transparent so the map could show through
        Owlbear's own rendering, and everything hard about it followed from not owning the view.
        Here we draw the map ourselves, so map and mask agree by construction rather than by our
        arithmetic agreeing with somebody else's.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e1020;
        color: #e8e9f5;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        overflow: hidden;
        user-select: none;
      }

      #surface {
        position: fixed;
        inset: 0;
        outline: none;
        /* Ours, not the browser's: without this a touch drag scrolls the page and a pinch zooms the
           document, both fighting the navigation underneath. */
        touch-action: none;
      }

      /*
        The canvas is what pans, so the grab cursor lives here rather than on the surface — over a
        button or a slider the pointer should look like a pointer.
      */
      #canvas {
        position: fixed;
        inset: 0;
        display: block;
        /*
          Stated, not inferred from `inset: 0`.

          A canvas is a *replaced* element, so it keeps its intrinsic 300x150 rather than stretching
          to fill four zero insets the way a div would. It ends up full-size anyway once the first
          frame runs and sets explicit dimensions — but until then it is a small rectangle in the
          corner, and everything outside it hits the surface behind. Found by asking
          `elementFromPoint` where a press over the map actually lands, which answered `#surface`.
        */
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #canvas.dragging {
        cursor: grabbing;
      }
      /*
        Something slow is running. The cursor says it wherever the pointer is, which is the half that
        survives the derive moving to a worker — only the *ability to keep interacting* changes then,
        and the cursor is what carries that rather than a dimmed panel.
      */
      body.working #canvas,
      body.working #canvas.grab-target {
        cursor: progress;
      }
      /*
        Over a vertex you can take hold of.

        A crosshair rather than a hand, and the reason came from a room: the grab cursor's fingers
        sit exactly over the dot being aimed at, so the target disappears at the moment of aiming
        (user, 2026-09-05). A crosshair is centred and open, so the handle stays visible under it.
      */
      #canvas.grab-target,
      #canvas.grab-target.dragging {
        cursor: crosshair;
      }
      /*
        Named for what each marks on the canvas, so the prose and the picture agree.

        The values come from `palette.ts` at start-up rather than being written here. They used to be
        hardcoded hexes beside comments asking whoever changed one to change the other, which is a
        promise nobody can keep across three layer modules and a stylesheet.
      */
      .join-key,
      .gap-key,
      .addink-key {
        color: var(--additive);
      }
      .suppress-key {
        color: var(--subtractive);
      }

      /* ----------------------------------------------------------------------------------------
         The controls, docked rather than floating.

         The click-through overlay kept its controls in the popover and spent real machinery on not
         painting over them — a poll, a heartbeat and a reserved band down one side. Owning the
         surface means the controls simply have a place on it, and the map is drawn in what is left.
         ---------------------------------------------------------------------------------------- */
      /*
        The drawer: it slides out **beside** the strip rather than under it, and it is only as tall
        as it needs to be.

        Three things follow from that and each was asked for. The strip never moves, so the buttons
        are in the same place whether or not something is open. The map stays visible above and
        below whatever is being read. And `--drawer-top` puts it level with the button that opened
        it, so the thing you pressed and the thing that appeared are plainly the same subject — set
        from the button's own position in `accordion.ts`, because only the strip knows where its
        buttons are.
      */
      #panel {
        position: fixed;
        top: var(--drawer-top, 0.6rem);
        left: 4.4rem;
        width: 20rem;
        max-width: calc(100vw - 5.6rem);
        /* Bounded by whatever is left between the anchor and the bar, so a long group scrolls
           inside the drawer rather than running off the bottom of the window. */
        max-height: calc(100vh - var(--drawer-top, 0.6rem) - 3.4rem);
        box-sizing: border-box;
        /* A column, so the title can stay put while the controls scroll under it. */
        display: flex;
        flex-direction: column;
        border-radius: 0.5rem;
        background: rgba(16, 18, 36, 0.97);
        border: 1px solid rgba(187, 153, 255, 0.25);
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
      }
      #panel-head {
        flex: none;
        padding: 0.7rem 0.9rem 0;
      }
      /*
        `min-height: 0` is what makes the scroll actually happen: a flex child's default is
        `min-height: auto`, which refuses to shrink below its content, so the body would grow the
        column past the viewport and take the head off the top with it rather than scrolling.
      */
      #panel-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 0.9rem 0.9rem;
      }
      #panel.hidden {
        display: none;
      }
      /*
        No drawer open. The whole panel goes, so the map is plainly visible — which on a surface
        whose entire job is looking at a map is the state it most needs. The strip stays, because
        it is how the drawer comes back.
      */
      #panel.shut {
        display: none;
      }

      h1 {
        margin: 0 0 0.15rem;
        font-size: 1rem;
      }
      h2 {
        margin: 1.2rem 0 0.5rem;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #bb99ff;
      }
      .sub {
        margin: 0 0 0.4rem;
        color: #9aa0c8;
        font-size: 0.8rem;
      }
      /*
        Most of these are empty now, and an empty paragraph is still a paragraph.

        The blurbs and hints went from "always present" to "present when they earn it" (2026-09-09),
        and the elements stayed: a row's hint is repainted as measurements land, so it cannot simply
        not be built. Without this every step header carries 0.4rem of nothing under it and every
        slider a blank line, which is the same wasted column the prose was taking.
      */
      .sub:empty,
      .row .hint:empty {
        display: none;
      }

      .row {
        margin: 0 0 0.9rem;
      }
      .row .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .row label {
        font-weight: 600;
      }
      .row .value {
        font-family: ui-monospace, Consolas, monospace;
        color: #ffd479;
      }
      .row input[type="range"] {
        width: 100%;
        margin: 0.3rem 0 0.1rem;
        accent-color: #bb99ff;
      }
      .row .hint {
        margin: 0;
        font-size: 0.76rem;
        color: #9aa0c8;
      }
      .row .hint b {
        color: #c9cdea;
      }
      /*
        The colour pickers, sized to the line of text they sit on — room, 2026-09-13: "those have a
        big color rectangle with a thick boundary, let's shrink them to be closer in height to the
        words. The borders can be much thinner."

        **The thick boundary was the browser's, not ours.** A native colour input draws its own inner
        swatch with its own heavy border, inside whatever box the page gives it — so setting a thin
        border here only ever added a second, thinner line around a thick one. The vendor
        pseudo-elements below are what actually remove it, and `::-moz-color-swatch` is the one that
        matters for the browser this is used in.

        They also had no size of their own at all in the four rows that are not ink, which is how they
        came out at the UA's default of roughly 50 by 27 — a rectangle twice the height of the label
        beside it.
      */
      .row input[type="color"] {
        /*
          `flex: none`, and it is not decoration: the row is a flex line and a colour input has no
          intrinsic width to defend itself with, so in a narrow rail it was squeezed to **2px** —
          the two borders with nothing between them. Measured, not guessed.
        */
        flex: none;
        width: 2.1rem;
        height: 1.15rem;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 0.2rem;
        background: transparent;
        cursor: pointer;
      }
      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .row input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 0.12rem;
      }
      .row input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 0.12rem;
      }
      /*
        `.swatches` was here, for the seven ink presets. They went on 2026-09-13 so that ink is a
        colour row like the other four, and the rules went with the markup rather than being left
        to style nothing.
      */

      /*
        The indeterminate strip, along the top edge of the canvas.

        Peripheral and covers nothing: a derive is the better part of a second and needs to read as
        working rather than as a hang, but it happens on every slider release and must not be
        something a GM has to look at. It says "in flight" and deliberately not "how far", because
        the trace reports no progress and a bar that invented one would be a guess drawn as a
        measurement.
      */
      #working {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 30;
        overflow: hidden;
        display: none;
      }
      body.working #working {
        display: block;
      }
      #working::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        background: #bb99ff;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      /*
        A held handle, at the value the picture was actually computed from.

        The staleness signal used to be a line of small monospace text in the bottom-right corner
        while the GM's attention was on the slider they had just moved. The information was never
        missing; it was nowhere near where anyone was looking. On the track it is also legible when
        several rows are ahead at once, which one status line can never be.
      */
      /*
        The ghost is a grey circle the size of the handle, sitting exactly where the handle would be
        (room, 2026-09-10: "it should be a gray circle matching the control, so it's visually easier
        to place the circle back where it was before").

        It was a 2px amber hairline positioned at a bare percentage of the track. That was off by up
        to half a thumb at either end, because a range thumb's centre never reaches the track's own
        edges — invisible on a hairline, and exactly the wrong thing for a mark whose job is to have
        the handle put back on top of it. `settingRows` does the inset arithmetic against `--thumb`.

        **`--thumb` is matched to the browser's own handle rather than set on it**, which is the one
        assumption here: the native thumb is 16 CSS pixels. The alternative was restyling every
        slider's thumb so its size is known, which is a larger change to every control than a ghost
        warrants. **If the ghost sits beside rather than under the handle at either end of a track,
        this is the number that has drifted.**

        **Pixels, not `rem`, and that was a measured mistake.** The first version said `1rem`, and
        this surface's root text size is 13px — so the ghost came out 13px against a 16px thumb and
        the inset used the wrong width. The native thumb is sized in CSS pixels and does not follow
        the root font, so neither may this. Measured in Chromium on 2026-09-10, and **confirmed in a
        room in Firefox on 2026-09-13** — under the handle mid-track, which settles the size, and
        under it at both ends, which settles the inset. Those are the two ways this can be wrong.

        The vertical centring needs the margin on the track and not on the input: centring at 50% is
        only the handle's centre if the box is exactly the input's box.
      */
      .row .track {
        --thumb: 16px;
        position: relative;
        margin: 0.3rem 0 0.1rem;
      }
      .row .track input[type="range"] {
        display: block;
        margin: 0;
      }
      .row .ghost {
        position: absolute;
        top: 50%;
        width: var(--thumb);
        height: var(--thumb);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: rgba(201, 205, 234, 0.45);
        box-shadow: 0 0 0 1px rgba(201, 205, 234, 0.7);
        pointer-events: none;
      }

      /* ----------------------------------------------------------------------------------------
         The tool strip: what a press means, chosen once for the whole surface.

         Docked beside the rail rather than inside a step, which is the change that lets the rail
         stop being exclusive. While a heading bound the drag, two expanded headings were two
         meanings for one press; with the verb chosen here a heading decides only what is on screen.

         Banded in the order the rail is numbered by, so reading down the strip and reading down the
         rail meet the same three subjects in the same sequence.
         ---------------------------------------------------------------------------------------- */
      /* The strip does not move. The drawer opens beside it, so a group's button is in the same
         place whether or not anything is open — which is the whole reason the drawer went to the
         right rather than pushing the column across. */
      #tools {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 2.6rem;
        width: 4rem;
        box-sizing: border-box;
        padding: 0.9rem 0.4rem;
        overflow-y: auto;
        background: rgba(12, 14, 30, 0.94);
        border-right: 1px solid rgba(187, 153, 255, 0.25);
        backdrop-filter: blur(6px);
      }
      #tools.hidden {
        display: none;
      }
      /*
        The band captions — Look, Ink, Walls — are the only words in the column, and a room found them
        hard to read (2026-09-10). Their contrast was fine at 5.39:1; their size was not, at 9.1px of
        uppercase. 11px is the floor the design record already set for the smallest text on this
        surface, and the colour is the rail's own secondary grey rather than a dimmer one of its own.
      */
      .tool-band {
        margin: 0 0 0.3rem;
        text-align: center;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9aa0c8;
      }
      /*
        A group's name, which is also the button that opens its drawer.

        **Deliberately not glyph-shaped.** Two things can be highlighted in this column at once — an
        armed verb and an open panel — and they are told apart by *shape* rather than by colour: a
        panel is a word, a verb is a picture. Nothing has to be learned for the strip to keep
        answering "what is armed" at a glance.
      */
      /* A group's settings button. Same glyph shape as a verb, so the column reads as one kind of
         control; it is told apart by being the only glyph above a group's tools rather than by a
         treatment of its own. */
      button.tool.params {
        margin-bottom: 0.15rem;
      }
      button.tool-band {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
        width: 100%;
        padding: 0.25rem 0.1rem;
        border: 0;
        border-radius: 0.3rem;
        background: transparent;
        font: inherit;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9aa0c8;
        cursor: pointer;
      }
      button.tool-band:hover:not(:disabled) {
        color: #e8e9f5;
        background: rgba(187, 153, 255, 0.1);
      }
      /* The open drawer, named. An underline rather than a fill, so it cannot be mistaken for the
         armed verb's pressed glyph two rows down. */
      button.tool-band[aria-pressed="true"] {
        color: #bb99ff;
        box-shadow: inset 0 -2px 0 #bb99ff;
      }
      /* The same 0.65 every other inactive thing on this surface uses, measured against the 3:1
         floor for non-text UI. */
      button.tool-band:disabled {
        opacity: 0.65;
        cursor: default;
      }
      button.tool-band .walls-mark {
        width: 11px;
        height: 11px;
      }
      .tool-rule {
        height: 1px;
        margin: 0.7rem 0;
        background: rgba(187, 153, 255, 0.18);
      }
      button.tool {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin: 0 0 0.2rem;
        padding: 0.4rem 0;
        border-radius: 0.3rem;
        border: 1px solid transparent;
        background: transparent;
        color: #c2c7e4;
        cursor: pointer;
      }
      /*
        Sized here rather than on the element, so one rule covers all seven. `currentColor` in the
        glyph means the selected state needs no second rule: the button inverts and the drawing
        follows.
      */
      button.tool svg {
        width: 1.4rem;
        height: 1.4rem;
        flex: none;
      }
      button.tool:hover:not(:disabled) {
        background: rgba(187, 153, 255, 0.14);
        color: #e8e9f5;
      }
      button.tool[aria-pressed="true"] {
        background: #bb99ff;
        border-color: #bb99ff;
        color: #14162a;
        font-weight: 600;
      }
      /*
        **0.65, matching a locked accordion header, and both numbers are measured.** At 0.4 a disabled
        glyph computed to 2.74:1 against the strip — under the 3:1 floor for non-text marks — and in
        the state a GM meets first, before a map or a graph, most of the column is disabled. 0.65 is
        5.35:1: plainly inactive beside a live glyph, and legible. One value for "inactive" across the
        surface rather than a second, dimmer one here.
      */
      button.tool:disabled {
        opacity: 0.65;
        cursor: default;
      }

      /*
        What the tool in hand does, at the top of the rail rather than beside the tool's controls.

        Under a rail that no longer forces one section shut, those controls may be collapsed while
        the tool is still in hand — and what a press will do must not depend on which headings
        happen to be expanded.
      */
      #tool-hint {
        margin: 0 0 0.9rem;
        padding: 0.45rem 0.6rem;
        border-left: 2px solid #bb99ff;
        background: rgba(187, 153, 255, 0.09);
        font-size: 0.8rem;
        color: #c2c7e4;
      }
      #tool-hint:empty {
        display: none;
      }
      /*
        The tool's own controls, sharing the hint's left rule so the two read as one block about the
        thing in hand rather than as a hint and then some unrelated sliders.

        Pulled up under the hint by a negative margin matching the hint's own bottom, so a tool with
        a hint and controls shows one bordered band and a tool with only a hint shows the same band
        shorter. `:empty` is what makes that work with no tool selected at all.
      */
      #tool-controls:not(:empty) {
        margin: -0.9rem 0 0.9rem;
        padding: 0.45rem 0.6rem 0.1rem;
        border-left: 2px solid #bb99ff;
        background: rgba(187, 153, 255, 0.09);
      }
      #tool-controls .row:last-child {
        margin-bottom: 0.5rem;
      }

      /*
        How much a re-read would cost, in the head so it does not depend on what is expanded.

        Amber rather than red: hand edits are not a problem, they are work. What the line is for is
        that changing the reading throws them away, and a GM cannot weigh that without knowing there
        is something to weigh. Absent at zero, which is most of the time.
      */
      /*
        Whether a layer is drawn at all, beside the hint that says what a press does.

        Grows with what is happening rather than listing all five always: a switch appears for a
        layer something is actually asking for, so the row is empty when nothing is, and a layer the
        GM has hidden keeps its switch because that is how it comes back.
      */
      #layer-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin: 0 0 0.9rem;
      }
      #layer-row:empty {
        display: none;
      }
      /* Styled as the tool strip's band captions are, so the surface has one look for "this word
         names the row after it" rather than two. */
      .layer-caption {
        align-self: center;
        margin-right: 0.15rem;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #9aa0c8;
      }
      button.layer {
        padding: 0.2rem 0.45rem;
        border-radius: 0.3rem;
        border: 1px solid rgba(187, 153, 255, 0.3);
        background: transparent;
        color: #7f86ad;
        font: inherit;
        font-size: 0.72rem;
        cursor: pointer;
      }
      button.layer:hover {
        color: #e8e9f5;
      }
      button.layer[aria-pressed="true"] {
        background: rgba(187, 153, 255, 0.18);
        border-color: rgba(187, 153, 255, 0.55);
        color: #e8e9f5;
      }

      /*
        Undo and redo, as a pair, above the count of what they act on.

        Sized and coloured like the tool strip's buttons rather than like the chip they replaced: they
        are glyph buttons on a dark ground, and the surface already has one look for that. Hidden
        entirely when both are dead, so a rail that has never been edited carries no furniture — the
        `:disabled` pair is the ordinary state for the first minute of a session.
      */
      #history-row {
        display: flex;
        gap: 0.25rem;
      }
      button.history {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.9rem;
        padding: 0.25rem 0;
        border-radius: 0.3rem;
        border: 1px solid rgba(187, 153, 255, 0.3);
        background: transparent;
        color: #c2c7e4;
        cursor: pointer;
      }
      button.history svg {
        width: 1.1rem;
        height: 1.1rem;
        flex: none;
      }
      button.history:hover:not(:disabled) {
        background: rgba(187, 153, 255, 0.14);
        color: #e8e9f5;
      }
      /* The same 0.65 the tool strip and the locked headers use, which is the one value for
         "inactive" on this surface and is measured against the 3:1 floor. */
      button.history:disabled {
        opacity: 0.65;
        cursor: default;
      }

      /* ----------------------------------------------------------------------------------------
         The groups, as a rail rather than an exclusive accordion.

         Every header stays on screen in order, so the cascade is a shape rather than something to
         remember. **Several may be expanded at once**, which is what the tool strip bought: while a
         step bound the drag, exclusivity was what kept "one meaning for a press" true, and forcing
         one section shut to read another made the commonest move in the job expensive.
         ---------------------------------------------------------------------------------------- */
      .step {
        border-top: 1px solid rgba(187, 153, 255, 0.18);
      }
      .step:last-of-type {
        border-bottom: 1px solid rgba(187, 153, 255, 0.18);
      }
      .step-header {
        display: block;
        width: 100%;
        padding: 0.6rem 0.1rem;
        border: 0;
        background: transparent;
        color: #9aa0c8;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        text-align: left;
        cursor: pointer;
      }
      .step-header:hover:not(:disabled) {
        color: #e8e9f5;
      }
      /*
        A group the map gate has not opened yet. Dimmed rather than hidden, so the order of what is
        coming is visible from the first frame — the rail's order is the cascade, and a cascade with
        its later half missing does not teach it.

        **0.65 rather than 0.4, and the number is measured.** At 0.4 the header computed to 2.17:1
        against the panel, which is below even the 3:1 floor for non-text UI — so a heading that
        exists precisely to be *read* while inactive could not be. 0.65 lands at 3.74:1: still
        unmistakably disabled beside a live header at 7.26:1, and legible.
      */
      .step.locked > .step-header {
        opacity: 0.65;
        cursor: default;
      }
      /* The open step is named in the accent colour and marked down the edge, because an accordion
         header is a weaker "you are here" than a selected tab and needs the help. */
      .step.open > .step-header {
        color: #bb99ff;
        box-shadow: inset 2px 0 0 #bb99ff;
        padding-left: 0.6rem;
      }
      /*
        The mark: a miniature wall graph on the header of any group whose controls would rebuild
        walls the GM has changed by hand. `wallsMark.ts` carries why it is this and not a count.

        Baseline-aligned rather than floated, so it reads as part of the heading rather than as a
        badge stuck to it — a badge is what made it look like a modifier on the tool.
      */
      .step-header.marked {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }
      .walls-mark {
        flex: none;
        /* Optically centred against uppercase letterforms, which sit above the baseline. */
        margin-top: -0.06rem;
      }
      /*
        The sentence the mark cannot carry. Cased down the edge in the structure colour so the two
        read as one statement, and quiet enough that a group wearing it does not shout on every open.
      */
      /*
        A control that would rebuild the walls, while they hold hand edits.

        Dimmed rather than hidden, because reading it is the point — the whole reason the gate is on
        the control and not on the group is that opening a group to see what a threshold is set to
        should cost nothing. The mark beside the name is the way in.
      */
      .row.locked input[type="range"] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row-name {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      button.row-lock {
        display: flex;
        align-items: center;
        padding: 0.1rem;
        border: 0;
        border-radius: 0.25rem;
        background: transparent;
        cursor: pointer;
      }
      button.row-lock:hover {
        background: rgba(122, 167, 255, 0.18);
      }
      .walls-notice {
        margin: 0 0 0.6rem;
        padding: 0.45rem 0.6rem;
        border-left: 2px solid var(--structure, #7aa7ff);
        background: rgba(122, 167, 255, 0.09);
        border-radius: 0 3px 3px 0;
        font-size: 0.76rem;
        line-height: 1.45;
        color: #c3c7e4;
      }
      .walls-notice b {
        color: #e8e9f5;
        font-weight: 600;
      }
      .step:not(.open) > .step-body {
        display: none;
      }
      .step-body {
        padding: 0 0 0.4rem 0.6rem;
      }
      .step-body h3 {
        margin: 1rem 0 0.35rem;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa0c8;
      }

      #view-group {
        margin-top: 0.4rem;
      }

      /* A step's own actions, at the end of its body. */
      .step-actions {
        display: flex;
        gap: 0.4rem;
        margin: 0.6rem 0 0.4rem;
      }
      .step-actions .quiet {
        border-color: rgba(187, 153, 255, 0.25);
        background: transparent;
        color: #9aa0c8;
      }
      .step-actions .quiet:hover {
        color: #e8e9f5;
      }
      .step-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* The map picker, the one step whose body is a list rather than sliders. */
      .maps {
        margin: 0.2rem 0 0.4rem;
      }
      .maps label {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        padding: 0.3rem 0.4rem;
        border-radius: 0.35rem;
        cursor: pointer;
      }
      .maps label:hover {
        background: rgba(187, 153, 255, 0.14);
      }
      .maps input {
        margin: 0;
        accent-color: #bb99ff;
      }
      .maps .note {
        color: #9aa0c8;
        font-size: 0.78rem;
      }

      /* ----------------------------------------------------------------------------------------
         The bar. Deliberately outside the panel, so hiding the controls to see the whole map does
         not also hide the way out.

         **Bottom right, and it has a ground** (user, 2026-09-14). Two things were wrong with the
         top. *Put on the map* and *Close* are a confirm-and-leave pair, and the bottom right is
         where a dialog puts those — this modal is far closer to a dialog than to a window. And
         along the bottom it closes the L with the rail rather than competing for the top edge.

         It also had no surface of its own, so it read as loose chips scattered on the map rather
         than as one thing — which got worse the moment it carried bare text. The ground is the
         panel's, exactly, so the two pieces of chrome read as one system.
         ---------------------------------------------------------------------------------------- */
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        /*
          Three tracks so the middle one is centred on the **window**, not on whatever is left of
          it. A flex row with the message in it would push the buttons right by however long the
          message happened to be, so they would drift as the surface talked.
        */
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 0.7rem;
        box-sizing: border-box;
        background: rgba(16, 18, 36, 0.94);
        border-top: 1px solid rgba(187, 153, 255, 0.25);
        backdrop-filter: blur(6px);
      }
      /* The buttons themselves, in the middle track. */
      #bar-actions {
        grid-column: 2;
        display: flex;
        gap: 0.35rem;
        align-items: center;
      }
      /*
        On a ground of its own, a chip no longer has to carry one to be legible over the map — so
        inside the bar they are outlines, and the eye is not asked to read eight filled pills in a
        row. The exception earns it: the commit is the one thing here that *does* something to the
        scene, and it is the only filled chip on the surface.
      */
      #bar button.chip {
        background: transparent;
        border-color: rgba(187, 153, 255, 0.28);
      }
      #bar button.chip:hover:not(:disabled) {
        background: rgba(187, 153, 255, 0.14);
        border-color: rgba(187, 153, 255, 0.5);
      }
      /*
        The pressed state has to win, and outspecifying it by accident is exactly what this rule did
        for a minute: `#bar button.chip` scores higher than `button.chip[aria-pressed]`, so the
        Controls toggle lost the only thing that says whether the rail is showing. Restated here at
        the bar's own specificity rather than by raising the shared rule, so the toggle keeps its
        filled look wherever else it is used.
      */
      #bar button.chip[aria-pressed="true"] {
        background: #bb99ff;
        border-color: #bb99ff;
        color: #14162a;
      }
      #bar button.chip#push {
        background: rgba(187, 153, 255, 0.9);
        border-color: rgba(187, 153, 255, 0.9);
        color: #17122b;
        font-weight: 600;
      }
      #bar button.chip#push:hover:not(:disabled) {
        background: #d3bcff;
        border-color: #d3bcff;
      }
      /*
        The map being traced, named where it stays true however the rail is scrolled.

        Truncated rather than wrapped: it is a reminder of which image is under everything rather
        than something to read, and the whole name is in the title for the once it matters.
      */
      #map-name {
        margin: 0 0.25rem 0 0;
        max-width: 14rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.78rem;
        color: #9aa0c8;
      }
      /* Document on one side, surface on the other. A hairline rather than a gap, because a gap
         at this size reads as a layout accident. */
      .bar-split {
        width: 1px;
        align-self: stretch;
        margin: 0.15rem;
        background: rgba(187, 153, 255, 0.28);
      }
      button.chip {
        padding: 0.4rem 0.65rem;
        border-radius: 0.35rem;
        border: 1px solid rgba(187, 153, 255, 0.45);
        background: rgba(34, 26, 58, 0.92);
        color: #e8e9f5;
        font: inherit;
        cursor: pointer;
      }
      button.chip:hover {
        background: #2c2250;
      }
      /*
        Disabled rather than hidden, so the surface says undo exists before there is anything to
        undo. A control that appears only once it is usable teaches nothing about what is possible.
      */
      button.chip:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.chip[aria-pressed="true"] {
        background: #bb99ff;
        color: #14162a;
        font-weight: 600;
      }
      /*
        The way out of a slow scene write, revealed only once one is slow.

        Closing waits for the write so the fog layer cannot be left half-replaced, which means the
        sheet is up and unresponsive to Escape for as long as the write takes. On a large map that
        is a couple of seconds and reads as working; if it stalls, it reads as a hang. This is the
        fourth exit — the probe's rule is that this surface must never become a cell — and it is
        hidden until there is a stall to escape, because a permanently visible "exit anyway" invites
        being pressed on every ordinary close.
      */
      button.chip.urgent {
        border-color: rgba(255, 212, 121, 0.75);
        color: #ffd479;
      }
      #exit-anyway[hidden] {
        display: none;
      }

      /*
        The confirmation, drawn by us rather than by Owlbear.

        The workspace already owns its whole surface and all of its input, so this needs no modal
        from the SDK and raises no question about nesting one inside another. It is only ever used
        for the two irreversible actions — freezing the graph and discarding it — because a dialog
        that appears often is one a GM learns to dismiss, and the boundary itself is shown by
        disabling what would cross it rather than by asking afterwards.
      */
      /*
        The confirmation's own rules used to be here, and they went with it into
        `confirmDialog.ts` on 2026-09-13 (the panel needed the same dialog, and copying thirty
        lines of CSS into a second page is how this project's drift bugs start). The component
        injects them and reads `--bg`, `--text` and `--dim` with these exact values as fallbacks,
        which this page does not define — so it looks the same as it always did.
      */

      /*
        The state of the mask, and the one thing on this page that must never be quietly absent.

        A blank sheet means "no mask is current", and that is a deliberate state rather than a
        failure — but a GM looking at bare map needs to know whether it is computing or has failed.
        (The third case this used to name, "the opacity is at zero", is not reported here and does
        not need to be: the slider's own readout says so, right beside the slider that did it.)
      */
      /*
        **Inside the bar**, in its left track, since the bar spans the bottom (2026-09-14).

        It sat bottom-right of a full-screen window while every control that writes to it is on
        the left — so a message about a press arrived as far from the press as the window allows,
        which is what made three working buttons read as dead. A spanning bar settles it properly:
        the message and the actions are one piece of furniture rather than two things that have to
        be kept from colliding.

        It is still **outside `#panel`**, which is the constraint that has not changed: it has to
        stay visible with the controls hidden, or a slow close looks like a hang.
      */
      #state {
        grid-column: 1;
        margin: 0;
        padding: 0;
        justify-self: start;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.75rem;
        color: #9aa0c8;
        /*
          Capped and wrapping, rather than growing left across the whole window.

          Most of what lands here is a short figure, but the point probe answers in whole sentences —
          and an unbounded line ran the full width of the map, which is a banner across the thing the
          GM is looking at. The middle bound keeps it clear of the controls on the left however wide
          the window is; the outer one stops a narrow window producing a negative width, which CSS
          discards as invalid — leaving exactly the unbounded line this is here to prevent.
        */
        /* The grid track bounds it now, so the old clearance arithmetic is gone — it cannot
           collide with the buttons, because it has a column of its own. What is left is a cap on
           how much of that column a long answer may use: the point probe replies in whole
           sentences, and an unbounded one would push the centre track off centre. */
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      /*
        With the controls hidden there is no panel to stay clear of, so the middle bound has
        nothing to do and the line was narrower than it needed to be. Only the outer guards
        remain. `:has()` is the whole mechanism; where it is unsupported the line simply keeps
        the tighter cap, which is the safe direction.
      */

      #state.bad {
        color: #ff8080;
      }
      #state.working {
        color: #ffd479;
      }
    </style>
  </head>
  <body>
    <!--
      Stage one: reading the map.

      The GM's question here is "what did it call ink", and the answer is a per-pixel verdict that
      only a picture can carry. So this surface draws the map, paints the ink mask over it, and puts
      the controls that decide the mask on the same surface as the mask.

      It replaces the click-through overlay entirely. That one was transparent and let drags reach
      Owlbear, which meant it could never be painted on and had to infer where the map was on a
      40ms poll — with a settle interval, a blank-and-restore, a reserved band so it would not cover
      the popover, and a heartbeat from the popover so it knew when the band was needed. Every one
      of those was machinery for not owning the transform. None of it is here.

      Deliberately NOT here either: a dismissal timer. The probe had one because an opaque sheet
      that might swallow every click is a trap, and that risk was real while input capture was
      unmeasured. It has since been measured over fifteen runs — pointer, wheel and keyboard all
      arrive, Escape included — so a working surface that evicts a GM mid-tuning would now be
      trading a real cost against a risk that has been retired.
    -->
    <div id="surface" tabindex="-1">
      <canvas id="canvas"></canvas>

      <div id="panel">
        <!--
          The head does not scroll. It says where you are and what a press will do, and both of those
          have to stay true while you are reading something further down — the hint scrolled away
          exactly when a GM was deep in a group and least able to remember which tool was in hand.
        -->
        <!--
          The only pinned part of the drawer: which group this is, and what is drawn.

          The layer row stays here rather than going into View, because a tool may turn a layer on
          and may never turn one off — so things accumulate, and the switches have to be somewhere
          a GM meets without going looking. Pinned while any drawer is open is the compromise: with
          the drawer shut they are looking at the map plainly, which is when the toggles are least
          needed.
        -->
        <div id="panel-head">
          <h1 id="mode-name">Fog Nudger</h1>
        </div>

        <!--
          The groups and the persistent View group, both built from the declaration in `steps.ts`
          rather than written out here. Two headings in the markup and a third in the code was how
          the sections drifted apart in the first place, and a group decides what the canvas paints,
          so it cannot be described in a place the canvas cannot read.
        -->
        <div id="panel-body">
          <!--
            What is in hand, above the group’s own controls.

            The sentence and the tool’s settings are the same subject — what a press does and how
            wide it does it — and they sit at the top because a tool is the more immediate of the
            two: a GM holding a brush is mid-gesture, where the group’s sliders are the setting they
            arrived at. Both are built by `renderPanel`, so their rows share the readout-painter
            lifecycle of every other row, and both collapse to nothing when no tool is in hand.
          -->
          <p id="tool-hint"></p>
          <div id="tool-controls"></div>
          <!--
            The layer switches, in their own drawer off the eye rather than pinned above every group.

            They were pinned because a tool may turn a layer on and never off, so what was drawn
            accumulated as the GM moved and the switches had to be somewhere they would be met. The
            picture is constant now, so nothing accumulates — and hiding one of four always-on layers
            is something a GM goes looking for rather than a correction they stumble on.
          -->
          <div id="layer-row"></div>
          <div id="steps"></div>
        </div>
      </div>

      <div id="tools"></div>

      <!--
        The bar: what belongs to the *document*, then what belongs to the surface.

        Undo and the map name were in the rail head until 2026-09-14, and the argument for putting
        them there was that this bar held Fit, Controls and Close — the surface — while undo acts
        on the document. That argument is answered rather than overturned: the bar is not only the
        surface any more, and what lives here is what stays true however the rail is scrolled and
        whatever tool is in hand.
      -->
      <div id="bar">
        <!--
          The state line lives in the bar now that the bar spans the bottom.

          It was a floating line in a corner, and the two of them sharing an edge meant arithmetic
          to keep them from colliding. A track of its own settles it: the message and the actions
          are one piece of furniture. Still outside `#panel`, which is the constraint that has not
          changed — it must stay visible with the controls hidden or a slow close reads as a hang.
        -->
        <p id="state">Starting…</p>
        <!-- The middle track, so the buttons are centred on the window rather than on whatever is
             left of it after the message. -->
        <div id="bar-actions">
          <p id="map-name" title="The map being traced">Loading…</p>
          <div id="history-row">
            <button class="history" id="undo" disabled title="Nothing to undo"></button>
            <button class="history" id="redo" disabled title="Nothing to redo"></button>
          </div>
          <!--
            The commit, beside the way out, because it is the surface's whole purpose and was at
            the foot of a section. Closing pushes too — this is the mid-session case, a change a
            table is waiting on without giving up the surface.
          -->
          <button class="chip" id="push">Put on the map</button>
          <span class="bar-split" aria-hidden="true"></span>
          <button class="chip" id="fit" title="Fit the whole map">Fit</button>
          <button class="chip" id="toggle-panel" title="Hide the controls" aria-pressed="true">Controls</button>
          <button class="chip" id="close">Close (Esc)</button>
          <button class="chip urgent" id="exit-anyway" hidden>Exit anyway</button>
        </div>
      </div>

      <div id="working" aria-hidden="true"></div>
    </div>

    <script type="module" src="./src/workspace.ts"></script>
  </body>
</html>
